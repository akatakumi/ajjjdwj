<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Break Sync</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL WORK TIMER</p>
        <h1>Break Sync</h1>
      </div>
      <div id="syncBadge" class="badge offline">未接続</div>
    </header>

    <section id="setupCard" class="card setup-card">
      <h2>同期設定</h2>
      <p>iPhoneとAndroidで同じ共有キーを入力してください。</p>
      <label>共有キー</label>
      <div class="input-row">
        <input id="roomKey" type="text" inputmode="text" autocomplete="off" maxlength="40" placeholder="例: yamashita-break" />
        <button id="saveKeyBtn" class="secondary">保存</button>
      </div>
      <p class="hint">Firebase設定済みなら、このキーごとにクラウド同期します。</p>
    </section>

    <section class="card hero-card">
      <div class="status-row">
        <div>
          <p class="eyebrow">現在の状態</p>
          <h2 id="statusText">勤務中</h2>
        </div>
        <div id="liveTimer" class="timer">00:00:00</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div class="progress-meta">
          <span>本日の休憩 <strong id="todayTotal">0分</strong></span>
          <span>残り <strong id="remaining">60分</strong></span>
        </div>
      </div>

      <button id="mainAction" class="primary big">休憩開始</button>
      <button id="undoBtn" class="ghost">直前の操作を取り消す</button>
    </section>

    <section class="card settings-card">
      <div class="section-title">
        <h2>設定</h2>
      </div>
      <div class="setting-line">
        <label for="dailyLimit">1日の休憩上限</label>
        <select id="dailyLimit">
          <option value="45">45分</option>
          <option value="60" selected>60分</option>
          <option value="75">75分</option>
          <option value="90">90分</option>
          <option value="120">120分</option>
        </select>
      </div>
    </section>

    <section class="card history-card">
      <div class="section-title">
        <h2>今日の履歴</h2>
        <button id="refreshBtn" class="mini">更新</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <section class="card install-card">
      <h2>ホーム画面に追加</h2>
      <p>iPhone: Safari → 共有 →「ホーム画面に追加」<br>Android: Chrome → メニュー →「ホーム画面に追加」</p>
    </section>

    <footer>個人用休憩管理 · Break Sync</footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
